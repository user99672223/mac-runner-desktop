# Interactive macOS desktop over Tailscale.
# Primary: RustDesk started from this job (inherits the runner agent's
# screen-capture/accessibility consent). Fallback: Apple Screen Sharing (VNC).
name: mac-desktop

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (arm64 has the hardware video encoder)
        default: macos-15
        type: choice
        options: [macos-15, macos-26, macos-26-intel]
      hours:
        description: Session length in hours (max 5.8)
        default: "2"

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    env:
      MAC_PASSWORD: ${{ secrets.MAC_PASSWORD }}
    steps:
      - name: Display at 1920x1080
        continue-on-error: true
        run: |
          brew install --quiet displayplacer
          id=$(displayplacer list | awk '/Persistent screen id/{print $4; exit}')
          displayplacer "id:$id res:1920x1080 scaling:off" || true

      - name: Admin user "dev" and SSH
        run: |
          set +e
          sudo sysadminctl -addUser dev -fullName dev -password "$MAC_PASSWORD" -admin
          sudo launchctl enable system/com.openssh.sshd
          sudo launchctl bootstrap system /System/Library/LaunchDaemons/ssh.plist 2>/dev/null
          sudo launchctl kickstart -k system/com.openssh.sshd
          sleep 1; sudo lsof -nP -iTCP:22 -sTCP:LISTEN | head -3 || echo "sshd NOT listening"

      - name: Install RustDesk
        run: |
          arch=$(uname -m); [ "$arch" = arm64 ] && arch=aarch64
          ver=$(curl -fsSL https://api.github.com/repos/rustdesk/rustdesk/releases/latest | python3 -c 'import json,sys;print(json.load(sys.stdin)["tag_name"])')
          curl -fsSL -o /tmp/rd.dmg "https://github.com/rustdesk/rustdesk/releases/download/$ver/rustdesk-$ver-$arch.dmg"
          hdiutil attach -nobrowse -quiet -mountpoint /tmp/rdmnt /tmp/rd.dmg
          sudo cp -R /tmp/rdmnt/RustDesk.app /Applications/
          hdiutil detach -quiet /tmp/rdmnt
          echo "RustDesk $ver installed"

      - name: Grant screen capture/input to RustDesk and Screen Sharing
        run: |
          set +e
          grant() { # db client client_type
            for svc in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent kTCCServiceListenEvent; do
              sudo sqlite3 "$1" "INSERT OR REPLACE INTO access
                (service, client, client_type, auth_value, auth_reason, auth_version, flags)
                VALUES ('$svc','$2',$3,2,4,1,0);" || echo "grant $svc $2 FAILED in $1"
            done
          }
          SYS="/Library/Application Support/com.apple.TCC/TCC.db"
          USR="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          SSD=/System/Library/CoreServices/RemoteManagement/screensharingd.bundle/Contents/MacOS/screensharingd
          AG=/System/Library/CoreServices/RemoteManagement/ScreensharingAgent.bundle/Contents/MacOS/ScreensharingAgent
          for db in "$SYS" "$USR"; do
            grant "$db" com.carriez.rustdesk 0
            grant "$db" com.apple.screensharing.agent 0
            grant "$db" "$SSD" 1
            grant "$db" "$AG" 1
          done
          # Same trick GitHub's image uses for its own agent: pre-approve the
          # monthly "is still recording your screen" prompt.
          PL="$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals.plist"
          for c in /Applications/RustDesk.app/Contents/MacOS/RustDesk "$SSD" "$AG"; do
            defaults write "$PL" "$c" -date "3024-01-01 00:00:00 +0000"
          done
          # NOTE: do not restart tccd here; doing so mid-job coincided with the job being cancelled

      - name: Apple Screen Sharing (VNC fallback)
        run: |
          set +e
          KS=/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart
          sudo "$KS" -activate -configure -access -on -users dev,runner -privs -all -restart -agent -menu
          sudo "$KS" -configure -allowAccessFor -specifiedUsers
          sudo "$KS" -configure -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "${MAC_PASSWORD:0:8}"
          sudo launchctl kickstart -k system/com.apple.screensharing

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gh-mac
          hostname: gh-mac
          args: --accept-dns=false

      - name: Start RustDesk (direct IP, fixed password) and hold
        run: |
          RD=/Applications/RustDesk.app/Contents/MacOS/RustDesk
          CFG="$HOME/Library/Preferences/com.carriez.RustDesk"
          mkdir -p "$CFG"
          # Direct IP access on 21118 (reachable only over the tailnet), no relay needed
          # Plain-text password here is read and encrypted by RustDesk on start
          # (the --password CLI needs a full admin install on macOS)
          printf "password = '%s'\n" "$MAC_PASSWORD" > "$CFG/RustDesk.toml"
          printf "[options]\ndirect-server = 'Y'\ndirect-access-port = '21118'\nverification-method = 'use-permanent-password'\napprove-mode = 'password'\n" > "$CFG/RustDesk2.toml"
          # Started from this step so it inherits the runner agent's TCC consent
          nohup "$RD" > /tmp/rustdesk.log 2>&1 &
          sleep 10
          echo "--- listening ports"; sudo lsof -nP -iTCP -sTCP:LISTEN | grep -E ':(21118|5900|22) ' || true
          echo "Tailscale IP: $(tailscale ip -4 | head -1)"
          end=$(( $(date +%s) + $(python3 -c "print(int(float('${{ inputs.hours }}')*3600))") ))
          while [ "$(date +%s)" -lt "$end" ] && [ ! -f /tmp/stop ]; do sleep 30; done
